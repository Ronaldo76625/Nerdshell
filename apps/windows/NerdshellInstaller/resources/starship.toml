format = """
[╭─](bold cyan)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$java\
$gradle\
$nodejs\
$package\
$docker_context\
$cmd_duration\
$line_break\
[╰─](bold cyan)$character
"""

add_newline = true
command_timeout = 1000

[os]
disabled = false
style = "bold white"
format = "[$symbol]($style) "

[os.symbols]
Windows = ""

[username]
show_always = false
style_user = "bold cyan"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "bold yellow"
format = "on [$hostname]($style) "

[directory]
style = "bold blue"
format = "[󰉋 $path]($style) "
truncation_length = 4
truncate_to_repo = false
fish_style_pwd_dir_length = 1
read_only = " "

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "≡${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[java]
symbol = " "
style = "bold red"
format = "via [$symbol$version]($style) "

[gradle]
symbol = " "
style = "bold cyan"
format = "via [$symbol$version]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol$version]($style) "

[package]
symbol = "󰏗 "
style = "bold 208"
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
style = "bold blue"
format = "via [$symbol$context]($style) "
only_with_files = true

[cmd_duration]
min_time = 1000
style = "bold yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
